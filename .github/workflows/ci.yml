name: RideLink Microservices CI

# මේ pipeline එක වැඩ කරන්නේ main සහ develop branches වලට push හෝ PR එකක් ආවමයි
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Services 4 වෙන වෙනම parallel run කරන්න matrix එකක් පාවිච්චි කරනවා
    strategy:
      fail-fast: false # එක service එකක් fail වුණත් අනිත් ඒවා දිගටම run වෙන්න දෙනවා
      matrix:
        include:
          - service: account-service
            db_secret: ACCOUNT_MONGO_URI
          - service: driver-service
            db_secret: DRIVER_MONGO_URI
          - service: ride-service
            db_secret: RIDE_MONGO_URI
          - service: fare-service
            db_secret: FARE_MONGO_URI

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        env:
          MONGO_URI: ${{ secrets[matrix.db_secret] }}
          JWT_SECRET: "my-super-secret-key-that-is-at-least-32-bytes-long"
          JWT_EXPIRATION_MS: 900000
        run: mvn clean test -Dsecurity.jwt.secret=my-super-secret-key-that-is-at-least-32-bytes-long -Dsecurity.jwt.expiration-ms=900000