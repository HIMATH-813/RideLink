name: RideLink Microservices CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    
    strategy:
      fail-fast: false 
      matrix:
        include:
          - service: account-service
            db_secret: ACCOUNT_MONGO_URI
          - service: driver-service
            db_secret: DRIVER_MONGO_URI
          - service: ride-service
            db_secret: RIDE_MONGO_URI
          - service: fare-service
            db_secret: FARE_MONGO_URI

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        working-directory: ./${{ matrix.service }}
        run: chmod +x ./mvnw

      - name: Build and Test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        env:
          MONGO_DB_URI: ${{ secrets[matrix.db_secret] }}
          JWT_SECRET: "my-super-secret-key-that-is-at-least-32-bytes-long"
          JWT_EXPIRATION_MS: 900000
        run: ./mvnw clean test -Dsecurity.jwt.secret=my-super-secret-key-that-is-at-least-32-bytes-long -Dsecurity.jwt.expiration-ms=900000