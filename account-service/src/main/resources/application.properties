spring.application.name=account-service
server.port=${PORT:8081}
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ridelink_accounts}
spring.data.mongodb.auto-index-creation=true
security.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-deployment-please-keep-it-long-enough}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
